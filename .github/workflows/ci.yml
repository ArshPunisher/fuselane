name: CI

# Fast gates on every PR and push to main, on all three OSes (L-79, L-89).
# Actions are pinned to commit SHAs (SECURITY.md T12); Renovate keeps them current.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup on the runner reads rust-toolchain.toml, so the pinned toolchain is used.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny
      - name: Linux webview libraries (Tauri)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: cargo-deny (licences, advisories, bans, sources)
        run: cargo deny check
      - name: shellcheck
        run: shellcheck tools/*.sh packaging/macos/*.sh packaging/homebrew/*.sh
      - name: Update feed generator tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettier
        run: pnpm format:check
      - name: TypeScript
        run: pnpm typecheck
      - name: Extension capture rules and message schema
        run: pnpm --filter @fuselane/capture test
      - name: Extension hand-off logic and builds (Chrome, Firefox)
        run: |
          pnpm --filter @fuselane/extension test
          pnpm --filter @fuselane/extension build
          pnpm --filter @fuselane/extension build:firefox
      - name: UI tests (WebKit and Chromium, demo backend)
        run: |
          pnpm --filter @fuselane/desktop exec playwright install --with-deps webkit chromium
          pnpm --filter @fuselane/desktop exec playwright test
      - name: Download page tests
        run: pnpm --filter @fuselane/site exec playwright test

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Conventional subjects, no AI attribution (WORKFLOW.md §3)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            git log -1 --format=%B "$c" > msg.txt
            tools/check-commit-msg.sh msg.txt || status=1
          done
          exit $status

  extension-host:
    name: Extension ↔ native host (Linux)
    # A real Chromium loads the built extension, `fuselane browsers` writes the host
    # manifest into a temporary config folder, and the extension pings the host.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the CLI
        run: cargo build --locked -p fuselane-cli
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the extension
        run: pnpm --filter @fuselane/extension build
      - name: Extension talks to the host
        run: |
          pnpm --filter @fuselane/extension exec playwright install --with-deps chromium
          pnpm --filter @fuselane/extension e2e

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest
      - name: Linux webview libraries (Tauri)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build
        run: cargo build --workspace --locked
      - name: Networks this runner has
        # Classification problems show here first (a VM's card read as virtual).
        run: cargo run --locked -q -p fuselane-cli -- nets --all
      - name: Test
        # Retries stay off: a flaky test fails the run (L-94).
        run: cargo nextest run --workspace --locked --no-tests=warn
      - name: CLI smoke
        run: cargo run --locked -q -p fuselane-cli -- --version
      - name: Desktop self-test (headless)
        run: cargo run --locked -q -p fuselane-desktop -- --self-test
      - name: macOS install script against good and hostile releases
        if: runner.os == 'macOS'
        run: sh packaging/macos/test-install.sh
