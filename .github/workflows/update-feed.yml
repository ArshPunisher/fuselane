name: Update feed

# When a release is published (never while it is a draft), builds the download
# page (apps/site), writes the signed updater feed next to it, and deploys both to
# GitHub Pages. Fuselane reads
# https://arshpunisher.github.io/fuselane/updates/latest.json (L-77: our own
# feed, because GitHub's /releases/latest skips pre-releases).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag to (re)deploy the feed for'
        required: true

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Signatures and notes from the release
        run: |
          mkdir -p sigs
          gh release download "$TAG" --pattern '*.sig' --dir sigs
          gh release view "$TAG" --json body --jq .body > notes.md
          ls sigs
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the site
        run: pnpm --filter @fuselane/site build
      - name: Write the feed next to the page
        run: |
          version="${TAG#v}"
          mkdir -p site
          cp -R apps/site/dist/. site/
          mkdir -p site/updates
          python3 tools/update_feed.py "$version" \
            "https://github.com/${{ github.repository }}/releases/download/$TAG" sigs notes.md > site/updates/latest.json
          cat site/updates/latest.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: 'Tell search engines the page changed (IndexNow: Bing, Yandex and others)'
        continue-on-error: true
        run: |
          curl -fsS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d '{"host":"arshpunisher.github.io","key":"ecf82e17baf091ac8a4c27c96d02085b","keyLocation":"https://arshpunisher.github.io/fuselane/ecf82e17baf091ac8a4c27c96d02085b.txt","urlList":["https://arshpunisher.github.io/fuselane/","https://arshpunisher.github.io/fuselane/download/","https://arshpunisher.github.io/fuselane/faq/","https://arshpunisher.github.io/fuselane/support/"]}' \
            -w 'IndexNow: HTTP %{http_code}\n' -o /dev/null
