[package]
name = "fuselane-engine-http"
description = "Segmented, multi-network HTTP download engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
percent-encoding = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net", "io-util"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
fuselane-transport.workspace = true
fuselane-storage.workspace = true
fuselane-limits.workspace = true

[lints]
workspace = true

[dev-dependencies]
proptest = "1"
tempfile = "3"
fuselane-testkit.workspace = true
tokio = { version = "1", features = ["full", "test-util"] }
