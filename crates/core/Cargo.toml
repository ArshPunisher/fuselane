[package]
name = "fuselane-core"
description = "Jobs, queue, persistence and events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
fuselane-engine-http.workspace = true
fuselane-netif.workspace = true
fuselane-transport.workspace = true
fuselane-storage.workspace = true
fuselane-limits.workspace = true
tokio = { version = "1", features = ["net", "time", "rt", "macros"] }
url = "2"
percent-encoding = "2"
quick-xml = "0.42"
dirs = "6"

[lints]
workspace = true

[dev-dependencies]
fuselane-testkit.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = "3"
proptest = "1"
