[package]
name = "fuselane-engine-torrent"
description = "BitTorrent downloads with each peer pinned to a network (librqbit + a per-network SOCKS5 balancer)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
librqbit = { version = "9", default-features = false, features = ["rust-tls"] }
tokio = { version = "1", features = ["full"] }
fuselane-netif.workspace = true
fuselane-limits.workspace = true
thiserror = "2"
tracing = "0.1"
anyhow = "1"
socket2 = { version = "0.6", features = ["all"] }
fuselane-transport.workspace = true

[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
tokio-socks = "0.5"
tempfile = "3"

[lints]
workspace = true
