[package]
name = "fuselane-cli"
description = "Fuselane command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "fuselane"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
url = "2"
fuselane-netif.workspace = true
fuselane-transport.workspace = true
fuselane-engine-http.workspace = true

[dev-dependencies]
fuselane-testkit.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
