      .volt {

      .gap {

      }
      @media (prefers-reduced-motion: no-preference) {
        .t {

          animation-delay: calc(var(--i) * 22ms);
        }
        .gap {
          animation: blink 1.4s ease-in-out 1.2s infinite;
        }
      }
      @keyframes tick {
        from {
          opacity: 0;
        }
      }
      @keyframes blink {
        50% {
          opacity: 0.2;
        }
      }
      h1 {
        margin: 0;
        color: var(--ink);
        font-size: clamp(28px, 6vw, 40px);
        line-height: 1.1;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 8px;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 18px;
        border: 1px solid var(--hairline);
        border-radius: 8px;
        color: var(--ink);

      a:first-child {

        background: var(--fuse);

        font-weight: 600;
      }
      a:focus-visible {
        outline: 2px solid var(--fuse);
        outline-offset: 2px;
      }
