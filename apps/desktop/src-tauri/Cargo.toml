[package]
name = "fuselane-desktop"
description = "Fuselane desktop app (Tauri 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "fuselane-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fuselane-core.workspace = true
fuselane-engine-http.workspace = true
fuselane-netif.workspace = true
fuselane-limits.workspace = true
fuselane-transport.workspace = true

[dev-dependencies]
fuselane-testkit.workspace = true
tempfile = "3"

[lints]
workspace = true
