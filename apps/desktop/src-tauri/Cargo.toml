[package]
name = "fuselane-desktop"
description = "Fuselane desktop app (Tauri 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "fuselane-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
trash = "5"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fuselane-core.workspace = true
fuselane-engine-http.workspace = true
fuselane-engine-torrent.workspace = true
fuselane-api.workspace = true
fuselane-netif.workspace = true
fuselane-limits.workspace = true
fuselane-transport.workspace = true
fuselane-storage.workspace = true
fuselane-send.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
librqbit = { version = "9", default-features = false, features = ["rust-tls"] }
fuselane-testkit.workspace = true
tempfile = "3"

[lints]
workspace = true
