# cargo-deny: licences, advisories, bans and sources. Runs in the static CI job.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Build-time macro crate pulled in by gtk-rs 0.18 (Tauri's Linux webview stack); not
  # a vulnerability, no maintained replacement upstream yet. Revisit when Tauri moves to gtk4.
  { id = "RUSTSEC-2024-0370", reason = "unmaintained, transitive via gtk 0.18 in Tauri on Linux" },
  # ringbuf 0.4 double free needs an element whose Drop panics. librqbit-utp only stores
  # u8 (SharedRb<Heap<u8>>, stream_tx.rs), and Fuselane turns uTP off (ADR 0006).
  # Remove once librqbit moves to ringbuf >= 0.5.2.
  { id = "RUSTSEC-2026-0293", reason = "unreachable: ringbuf holds u8 in librqbit-utp; uTP disabled" },
]

[licenses]
version = 2
# Permissive licences compatible with Apache-2.0 distribution.
allow = [
  "Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0",
  # Mozilla root-certificate data (webpki-root-certs, via rustls-platform-verifier): permissive data licence.
  "CDLA-Permissive-2.0",
  # target-lexicon (via Tauri's Linux build deps): Apache-2.0 with a permissive extra exception.
  "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Layering (ARCHITECTURE.md §3): no UI shell inside the engine crates.
deny = [
  { name = "tauri", wrappers = ["fuselane-desktop", "tauri-plugin-single-instance", "tauri-plugin-opener", "tauri-plugin-dialog", "tauri-plugin-notification", "tauri-plugin-updater", "tauri-plugin-window-state", "tauri-plugin-fs", "tauri-plugin-autostart"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
